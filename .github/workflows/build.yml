# Builds gceTools on native runners for Linux, Windows and macOS.
# - Every push / PR: tests + builds, binaries uploaded as workflow artifacts.
# - Tag v*: additionally publishes a GitHub Release with all packages.
# macOS signing/notarization runs only if the APPLE_* secrets exist;
# otherwise the .app is unsigned (see README, "Instalación").
# Windows signing (SignPath Foundation, see CODE_SIGNING_POLICY.md) runs only
# on v* tags and only if the SIGNPATH_API_TOKEN secret exists: every signing
# request needs a manual approval in SignPath.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.1
  NFPM_VERSION: v2.49.0          # .deb / .rpm
  APPIMAGETOOL_VERSION: "1.9.1"  # .AppImage
  NODE_VERSION: "26" # Node.js 26 LTS for the frontend build

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (needed by go:embed)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Linux GUI deps (for vet of the main package)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet -tags webkit2_41 ./...
      - run: go test -race -tags webkit2_41 ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            nsis: true
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    env:
      # Exposed at job level so the signing step's `if:` can test for it.
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # gceTools' own "Desktop app" OAuth client for "Iniciar sesión con Google".
      # Injected with -ldflags so it never lives in the repository; without
      # these secrets the build simply lacks the built-in client.
      GCETOOLS_OAUTH_CLIENT_ID: ${{ secrets.GCETOOLS_OAUTH_CLIENT_ID }}
      GCETOOLS_OAUTH_CLIENT_SECRET: ${{ secrets.GCETOOLS_OAUTH_CLIENT_SECRET }}
      GCETOOLS_OAUTH_PROJECT: ${{ vars.GCETOOLS_OAUTH_PROJECT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/${{ env.APPIMAGETOOL_VERSION }}/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: NSIS
        if: matrix.nsis
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco does not put makensis on PATH; Wails silently skips the installer without it
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check makensis
        if: matrix.nsis
        run: makensis -VERSION

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Version
        id: v
        shell: bash
        run: |
          base=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/core/core.go)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            if [[ "$v" != "$base" ]]; then echo "::error::El tag v$v no coincide con core.Version=$base"; exit 1; fi
          else
            v="$base-dev+${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ldflags=-s -w -X gcetools/internal/core.Version=$v" >> "$GITHUB_OUTPUT"

      - name: Build GUI
        shell: bash
        run: |
          ld="${{ steps.v.outputs.ldflags }}"
          if [[ -n "$GCETOOLS_OAUTH_CLIENT_ID" ]]; then
            ld+=" -X gcetools/internal/auth.BuiltinClientID=$GCETOOLS_OAUTH_CLIENT_ID -X gcetools/internal/auth.BuiltinClientSecret=$GCETOOLS_OAUTH_CLIENT_SECRET -X gcetools/internal/auth.BuiltinClientProject=$GCETOOLS_OAUTH_PROJECT"
          fi
          args=(-platform "${{ matrix.platform }}" -trimpath -ldflags "$ld")
          [[ -n "${{ matrix.tags }}" ]] && args+=(-tags "${{ matrix.tags }}")
          [[ "${{ matrix.nsis }}" == "true" ]] && args+=(-nsis)
          wails build "${args[@]}"

      - name: Build CLI
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          ld="${{ steps.v.outputs.ldflags }}"
          if [[ -n "$GCETOOLS_OAUTH_CLIENT_ID" ]]; then
            ld+=" -X gcetools/internal/auth.BuiltinClientID=$GCETOOLS_OAUTH_CLIENT_ID -X gcetools/internal/auth.BuiltinClientSecret=$GCETOOLS_OAUTH_CLIENT_SECRET -X gcetools/internal/auth.BuiltinClientProject=$GCETOOLS_OAUTH_PROJECT"
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            for a in amd64 arm64; do GOARCH=$a CGO_ENABLED=0 go build -trimpath -ldflags "$ld" -o dist/gcetools-cli-$a ./cmd/gcetools-cli; done
            lipo -create -output "dist/gcetools-cli" dist/gcetools-cli-amd64 dist/gcetools-cli-arm64 && rm dist/gcetools-cli-*64
          else
            CGO_ENABLED=0 go build -trimpath -ldflags "$ld" -o "dist/gcetools-cli${ext}" ./cmd/gcetools-cli
          fi

      # ---- Windows signing with SignPath (optional, releases only) ----
      # Round 1 signs the executables; the NSIS installer is then rebuilt
      # around the signed gcetools.exe and signed in round 2.
      - name: Stage executables for signing
        id: sign-stage
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: mkdir -p unsigned-exes && cp build/bin/gcetools.exe dist/gcetools-cli.exe unsigned-exes/
      - name: Upload executables for signing
        id: up-exes
        if: steps.sign-stage.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exes-windows
          path: unsigned-exes/
          retention-days: 1
      - name: Sign executables (SignPath)
        if: steps.sign-stage.conclusion == 'success'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-exes
          github-artifact-id: ${{ steps.up-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # time to approve the request
          output-artifact-directory: signed-exes
      - name: Rebuild installer with the signed executable
        if: steps.sign-stage.conclusion == 'success'
        shell: bash
        run: |
          cp signed-exes/gcetools.exe build/bin/gcetools.exe
          cp signed-exes/gcetools-cli.exe dist/gcetools-cli.exe
          rm -f build/bin/*installer*.exe
          # same call Wails makes; the scripts were generated by `wails build -nsis`
          exe="$(cygpath -w "$PWD/build/bin/gcetools.exe")"
          (cd build/windows/installer && makensis "-DARG_WAILS_AMD64_BINARY=$exe" project.nsi)
          mkdir -p unsigned-installer && cp build/bin/gcetools-amd64-installer.exe unsigned-installer/
      - name: Upload installer for signing
        id: up-installer
        if: steps.sign-stage.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-windows
          path: unsigned-installer/
          retention-days: 1
      - name: Sign installer (SignPath)
        if: steps.sign-stage.conclusion == 'success'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.up-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
      - name: Verify Windows signatures
        if: steps.sign-stage.conclusion == 'success'
        shell: pwsh
        run: |
          Copy-Item signed-installer\gcetools-amd64-installer.exe build\bin\gcetools-amd64-installer.exe -Force
          foreach ($f in 'build\bin\gcetools.exe', 'dist\gcetools-cli.exe', 'build\bin\gcetools-amd64-installer.exe') {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne 'Valid') { throw "Firma no válida en $f" }
          }

      - name: Sign and notarize (macOS, optional)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}  # "Developer ID Application: Org (TEAMID)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}    # app-specific password
        run: |
          # APPLE_CERT_P12 (job env): base64 of the "Developer ID Application" .p12
          app=$(find build/bin -maxdepth 1 -name "*.app" | head -1)
          kc=build.keychain; pw=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$pw" $kc && security default-keychain -s $kc && security unlock-keychain -p "$pw" $kc
          security import cert.p12 -k $kc -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" $kc
          rm cert.p12
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "$app"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" dist/gcetools-cli
          ditto -c -k --keepParent "$app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"

      - name: Package
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"; n="gcetools-$v-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Linux)
              cp build/bin/gcetools dist/
              # runners have no FUSE; appimagetool runs extracted
              APPIMAGE_EXTRACT_AND_RUN=1 build/linux/package.sh "$v" dist .
              cp README.md LICENSE dist/
              tar -C dist -czf "$n.tar.gz" . ;;
            Windows)
              cp build/bin/gcetools.exe dist/ && cp README.md LICENSE dist/
              7z a "$n.zip" ./dist/* > /dev/null
              cp build/bin/*installer*.exe "$n-setup.exe" ;;
            macOS)
              app="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
              cp -R "$app" dist/ && cp README.md LICENSE dist/
              ditto -c -k --keepParent dist "$n.zip"
              # DMG: drag gceTools.app onto the Applications shortcut, on a
              # branded background (build/darwin/dmg-background.py) with the
              # app icon as volume icon. create-dmg lays the window out with
              # Finder; if that fails, fall back to a plain DMG.
              vol="gceTools ${v%%-*}" a="$(basename "$app")"
              mkdir -p dmg && cp -R "$app" dmg/
              tiffutil -cathidpicheck build/darwin/dmg-background.png build/darwin/dmg-background@2x.png -out dmg-background.tiff
              brew install --quiet create-dmg
              if ! create-dmg --volname "$vol" --volicon assets/brand/macos/gcetools.icns \
                  --background dmg-background.tiff --window-pos 200 120 --window-size 660 420 \
                  --icon-size 128 --text-size 13 --icon "$a" 170 215 --hide-extension "$a" \
                  --app-drop-link 490 215 --filesystem HFS+ "$n.dmg" dmg; then
                echo "::warning::create-dmg failed; building a plain DMG"
                rm -f "$n.dmg" rw.*.dmg
                ln -s /Applications dmg/Applications
                hdiutil create -volname "$vol" -srcfolder dmg -ov -format UDZO -fs HFS+ "$n.dmg"
              fi ;;
          esac
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: gcetools-${{ matrix.name }}
          path: |
            gcetools-*.tar.gz
            gcetools-*.zip
            gcetools-*-setup.exe
            gcetools-*.deb
            gcetools-*.rpm
            gcetools-*.AppImage
            gcetools-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "gceTools $GITHUB_REF_NAME" --generate-notes
