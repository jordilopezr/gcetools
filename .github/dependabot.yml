# Weekly dependency updates, grouped to keep the number of PRs low:
# one PR per ecosystem for minor/patch updates, majors grouped separately.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
      go-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      # typescript-eslint only supports typescript <6.1.0 (peer dependency);
      # newer versions break `npm ci`. Remove once typescript-eslint supports them.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
